  <title id="t">Minimum-curvature desurvey</title>
  <desc id="d">A three-station survey drawn in its north-vertical plane: the circular arcs of minimum curvature through the stations, the dashed chords between them, and at half-way measured depth the arc position used by GeoCond next to the chord midpoint it does not use.</desc>
