<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-labelledby="t d">
  <title id="t">Multiple-indicator kriging correction</title>
  <desc id="d">Raw indicator kriging estimates at seven thresholds for one target, which violate the order, and the bounded isotonic CDF published instead; beyond the first and last thresholds the tails are unmodeled.</desc>
  <style>
    .t { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .b { font: 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .m { font: 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
  </style>
  <rect width="660" height="400" fill="#0d1117"/>
  <text class="t" x="80" y="30">Multiple-indicator kriging: raw estimates and the bounded isotonic CDF</text>
  <line x1="114.3" y1="50" x2="114.3" y2="310" stroke="#30363d"/>
  <text class="m" x="114.3" y="326" text-anchor="middle">-0.99</text>
  <line x1="204.3" y1="50" x2="204.3" y2="310" stroke="#30363d"/>
  <text class="m" x="204.3" y="326" text-anchor="middle">-0.59</text>
  <line x1="278.9" y1="50" x2="278.9" y2="310" stroke="#30363d"/>
  <text class="m" x="278.9" y="326" text-anchor="middle">-0.27</text>
  <line x1="346.3" y1="50" x2="346.3" y2="310" stroke="#30363d"/>
  <text class="m" x="346.3" y="326" text-anchor="middle">0.03</text>
  <line x1="451.5" y1="50" x2="451.5" y2="310" stroke="#30363d"/>
  <text class="m" x="451.5" y="326" text-anchor="middle">0.49</text>
  <line x1="555.2" y1="50" x2="555.2" y2="310" stroke="#30363d"/>
  <text class="m" x="555.2" y="326" text-anchor="middle">0.94</text>
  <line x1="585.7" y1="50" x2="585.7" y2="310" stroke="#30363d"/>
  <text class="m" x="585.7" y="326" text-anchor="middle">1.07</text>
  <line x1="80" y1="288.3" x2="620" y2="288.3" stroke="#30363d"/>
  <text class="m" x="72" y="292.3" text-anchor="end">0.00</text>
  <line x1="80" y1="234.2" x2="620" y2="234.2" stroke="#30363d"/>
  <text class="m" x="72" y="238.2" text-anchor="end">0.25</text>
  <line x1="80" y1="180.0" x2="620" y2="180.0" stroke="#30363d"/>
  <text class="m" x="72" y="184.0" text-anchor="end">0.50</text>
  <line x1="80" y1="125.8" x2="620" y2="125.8" stroke="#30363d"/>
  <text class="m" x="72" y="129.8" text-anchor="end">0.75</text>
  <line x1="80" y1="71.7" x2="620" y2="71.7" stroke="#30363d"/>
  <text class="m" x="72" y="75.7" text-anchor="end">1.00</text>
  <text class="m" x="350.0" y="344" text-anchor="middle">threshold (native units)</text>
  <text class="m" x="72" y="42" text-anchor="end">P(Z &lt;= t)</text>
  <rect x="80" y="50" width="34.3" height="260" fill="#8b949e" fill-opacity="0.12"/>
  <rect x="585.7" y="50" width="34.3" height="260" fill="#8b949e" fill-opacity="0.12"/>
  <text class="m" x="86" y="302">unmodeled tail</text>
  <text class="m" x="614" y="302" text-anchor="end">unmodeled tail</text>
  <polyline points="114.3,269.0 204.3,133.3 278.9,133.3 346.3,94.4 451.5,94.4 555.2,78.1 585.7,78.1" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <circle cx="114.3" cy="269.0" r="5" fill="none" stroke="#f0883e" stroke-width="2"/>
  <circle cx="114.3" cy="269.0" r="4" fill="#58a6ff"/>
  <circle cx="204.3" cy="63.1" r="5" fill="none" stroke="#f0883e" stroke-width="2"/>
  <circle cx="204.3" cy="133.3" r="4" fill="#58a6ff"/>
  <circle cx="278.9" cy="203.6" r="5" fill="none" stroke="#f0883e" stroke-width="2"/>
  <circle cx="278.9" cy="133.3" r="4" fill="#58a6ff"/>
  <circle cx="346.3" cy="50.1" r="5" fill="none" stroke="#f0883e" stroke-width="2"/>
  <circle cx="346.3" cy="94.4" r="4" fill="#58a6ff"/>
  <circle cx="451.5" cy="138.6" r="5" fill="none" stroke="#f0883e" stroke-width="2"/>
  <circle cx="451.5" cy="94.4" r="4" fill="#58a6ff"/>
  <circle cx="555.2" cy="74.2" r="5" fill="none" stroke="#f0883e" stroke-width="2"/>
  <circle cx="555.2" cy="78.1" r="4" fill="#58a6ff"/>
  <circle cx="585.7" cy="81.9" r="5" fill="none" stroke="#f0883e" stroke-width="2"/>
  <circle cx="585.7" cy="78.1" r="4" fill="#58a6ff"/>
  <text class="b" x="80" y="368" fill="#f0883e" style="fill:#f0883e">open circles: raw ordinary indicator kriging, one covariance per threshold</text>
  <text class="b" x="80" y="386" fill="#58a6ff" style="fill:#58a6ff">filled line: corrected CDF (largest change 0.324), linear only between thresholds</text>
</svg>
