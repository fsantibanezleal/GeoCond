<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" role="img" aria-labelledby="t d">
  <title id="t">Support-integrated covariance</title>
  <desc id="d">A point observation, a composite interval with its Gauss nodes and a block target with a product Gauss rule; covariance between supports averages the model over their nodes, and the process nugget survives only between discrete supports at coincident nodes.</desc>
  <style>
    .t { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .b { font: 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .m { font: 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
  </style>
  <rect width="700" height="380" fill="#0d1117"/>
  <text class="t" x="24" y="30">Support-integrated covariance: every support is a known sampling measure</text>
  <circle cx="110" cy="170" r="7" fill="#58a6ff"/>
  <text class="b" x="70" y="215">point observation</text>
  <text class="m" x="70" y="233">one node, weight 1, discrete</text>
  <line x1="250" y1="80" x2="330" y2="260" stroke="#f0883e" stroke-width="3"/>
  <circle cx="252.7" cy="86.1" r="3.8" fill="#f0883e"/>
  <circle cx="263.6" cy="110.5" r="4.6" fill="#f0883e"/>
  <circle cx="280.5" cy="148.5" r="5.1" fill="#f0883e"/>
  <circle cx="299.5" cy="191.5" r="5.1" fill="#f0883e"/>
  <circle cx="316.4" cy="229.5" r="4.6" fill="#f0883e"/>
  <circle cx="327.3" cy="253.9" r="3.8" fill="#f0883e"/>
  <text class="b" x="215" y="285">composite interval</text>
  <text class="m" x="215" y="303">Gauss nodes, continuous</text>
  <rect x="470" y="90" width="160" height="160" fill="#58a6ff" fill-opacity="0.10" stroke="#3fb950" stroke-width="2"/>
  <circle cx="488.0" cy="108.0" r="4.5" fill="#3fb950"/>
  <circle cx="488.0" cy="170.0" r="5.5" fill="#3fb950"/>
  <circle cx="488.0" cy="232.0" r="4.5" fill="#3fb950"/>
  <circle cx="550.0" cy="108.0" r="5.5" fill="#3fb950"/>
  <circle cx="550.0" cy="170.0" r="7.0" fill="#3fb950"/>
  <circle cx="550.0" cy="232.0" r="5.5" fill="#3fb950"/>
  <circle cx="612.0" cy="108.0" r="4.5" fill="#3fb950"/>
  <circle cx="612.0" cy="170.0" r="5.5" fill="#3fb950"/>
  <circle cx="612.0" cy="232.0" r="4.5" fill="#3fb950"/>
  <text class="b" x="470" y="285">block target</text>
  <text class="m" x="470" y="303">product Gauss rule, continuous</text>
  <line x1="118" y1="168" x2="262" y2="120" stroke="#8b949e" stroke-dasharray="5 4"/>
  <line x1="336" y1="200" x2="468" y2="170" stroke="#8b949e" stroke-dasharray="5 4"/>
  <line x1="118" y1="172" x2="468" y2="200" stroke="#8b949e" stroke-dasharray="5 4"/>
  <text class="m" x="24" y="340">C(S, T) = sum over nodes p of S and q of T of w_p w_q C(y_q - x_p). The process nugget enters only between two</text>
  <text class="m" x="24" y="358">discrete supports at coincident nodes: a point keeps it, a continuous interval or block integrates it to zero.</text>
</svg>
